<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="850" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="f-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker>
    <marker id="f-cyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/></marker>
    <marker id="f-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker>
  </defs>
  <rect width="850" height="340" rx="10" fill="#0f172a"/>

  <!-- Feedback #3: queue depth to VSync (outermost) -->
  <path d="M670 150 L670 46 L70 46 L70 146" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#f-cyan)"/>
  <rect x="230" y="30" width="300" height="34" rx="6" fill="#0c4a6e" stroke="#38bdf8"/>
  <text x="380" y="45" fill="#e0f2fe" font-size="11" font-weight="700" text-anchor="middle">#3 queue depth → VSync</text>
  <text x="380" y="58" fill="#7dd3fc" font-size="10" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">unExecuteTaskNum_ via SetHardwareTaskNum</text>

  <!-- Feedback #2: buffer release wakes render thread -->
  <path d="M610 150 L610 104 L360 104 L360 146" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#f-amber)"/>
  <rect x="380" y="86" width="210" height="34" rx="6" fill="#451a03" stroke="#f59e0b"/>
  <text x="485" y="101" fill="#fef3c7" font-size="11" font-weight="700" text-anchor="middle">#2 buffer backpressure</text>
  <text x="485" y="114" fill="#fde68a" font-size="10" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">ReleaseLayerBuffers → notify</text>

  <!-- Forward pipeline -->
  <g font-size="12" font-weight="700" text-anchor="middle">
    <rect x="20" y="150" width="100" height="56" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <text x="70" y="174" fill="#f8fafc">DVSync</text><text x="70" y="191" fill="#94a3b8" font-size="10" font-weight="400">VSync scheduler</text>

    <rect x="150" y="150" width="120" height="56" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="210" y="174" fill="#fff">RSMainThread</text><text x="210" y="191" fill="#e0f2fe" font-size="10" font-weight="400">stage 1: prepare</text>

    <rect x="300" y="150" width="120" height="56" rx="6" fill="#7e22ce" stroke="#c084fc" stroke-width="1.5"/>
    <text x="360" y="174" fill="#fff">render thread</text><text x="360" y="191" fill="#f3e8ff" font-size="10" font-weight="400">stage 2: draw</text>

    <rect x="450" y="150" width="96" height="56" rx="6" fill="#334155" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="498" y="174" fill="#f8fafc">BufferQueue</text><text x="498" y="191" fill="#cbd5e1" font-size="10" font-weight="400">screen buffers</text>

    <rect x="576" y="150" width="124" height="56" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
    <text x="638" y="174" fill="#fff">composer</text><text x="638" y="191" fill="#d1fae5" font-size="10" font-weight="400">stage 3: compose</text>

    <rect x="730" y="150" width="100" height="56" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="780" y="174" fill="#7dd3fc">Display</text><text x="780" y="191" fill="#94a3b8" font-size="10" font-weight="400">HWC</text>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" marker-end="url(#f-gray)">
    <line x1="120" y1="178" x2="148" y2="178"/>
    <line x1="270" y1="178" x2="298" y2="178"/>
    <line x1="420" y1="178" x2="448" y2="178"/>
    <line x1="546" y1="178" x2="574" y2="178"/>
    <line x1="700" y1="178" x2="728" y2="178"/>
  </g>

  <!-- Feedback #1: delayed commit (self-loop on composer) -->
  <path d="M610 206 L610 230 L666 230 L666 210" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#f-green)"/>
  <rect x="470" y="244" width="300" height="38" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="620" y="260" fill="#d1fae5" font-size="11" font-weight="700" text-anchor="middle">#1 delayed commit</text>
  <text x="620" y="274" fill="#6ee7b7" font-size="10" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">CalculateDelayTime → hit target present time</text>

  <g font-size="11" fill="#94a3b8">
    <line x1="24" y1="316" x2="50" y2="316" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="58" y="320">frames flow forward</text>
    <line x1="200" y1="316" x2="226" y2="316" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="234" y="320">feedback: pacing and backpressure</text>
  </g>
</svg>
