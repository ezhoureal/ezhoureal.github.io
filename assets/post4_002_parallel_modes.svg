<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 400" width="850" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Abstract time: prepare = 120px, sync = 30px, draw = 150px. -->
  <rect width="850" height="400" rx="10" fill="#0f172a"/>

  <g font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">
    <!-- SINGLE_THREAD -->
    <text x="24" y="34" fill="#f8fafc" font-size="13" font-weight="700">RS_PARALLEL_TYPE_SINGLE_THREAD</text>
    <text x="24" y="68" fill="#38bdf8">main</text>

    <!-- SYNC -->
    <text x="24" y="124" fill="#f8fafc" font-size="13" font-weight="700">RS_PARALLEL_TYPE_SYNC</text>
    <text x="24" y="158" fill="#38bdf8">main</text>
    <text x="24" y="194" fill="#c084fc">render</text>

    <!-- ASYNC -->
    <text x="24" y="250" fill="#10b981" font-size="13" font-weight="700">RS_PARALLEL_TYPE_ASYNC (default)</text>
    <text x="24" y="284" fill="#38bdf8">main</text>
    <text x="24" y="320" fill="#c084fc">render</text>
  </g>

  <line x1="20" y1="94" x2="830" y2="94" stroke="#1e293b"/>
  <line x1="20" y1="220" x2="830" y2="220" stroke="#1e293b"/>

  <g font-size="12" font-weight="600" text-anchor="middle" fill="#fff">
    <!-- SINGLE_THREAD: everything on main -->
    <rect x="140" y="48" width="118" height="28" rx="4" fill="#0284c7"/><text x="199" y="67">Prepare F0</text>
    <rect x="260" y="48" width="148" height="28" rx="4" fill="#7e22ce"/><text x="334" y="67">Draw F0</text>
    <rect x="410" y="48" width="118" height="28" rx="4" fill="#0284c7"/><text x="469" y="67">Prepare F1</text>
    <rect x="530" y="48" width="148" height="28" rx="4" fill="#7e22ce"/><text x="604" y="67">Draw F1</text>

    <!-- SYNC: main waits for the whole frame -->
    <rect x="140" y="138" width="118" height="28" rx="4" fill="#0284c7"/><text x="199" y="157">Prepare F0</text>
    <rect x="260" y="138" width="178" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-dasharray="4,3"/><text x="349" y="157" fill="#94a3b8" font-weight="400">waiting</text>
    <rect x="440" y="138" width="118" height="28" rx="4" fill="#0284c7"/><text x="499" y="157">Prepare F1</text>
    <rect x="560" y="138" width="178" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-dasharray="4,3"/><text x="649" y="157" fill="#94a3b8" font-weight="400">waiting</text>

    <rect x="260" y="174" width="28" height="28" rx="4" fill="#f59e0b"/><text x="274" y="193" fill="#0f172a">S</text>
    <rect x="290" y="174" width="148" height="28" rx="4" fill="#7e22ce"/><text x="364" y="193">Draw F0</text>
    <rect x="560" y="174" width="28" height="28" rx="4" fill="#f59e0b"/><text x="574" y="193" fill="#0f172a">S</text>
    <rect x="590" y="174" width="148" height="28" rx="4" fill="#7e22ce"/><text x="664" y="193">Draw F1</text>

    <!-- ASYNC: main waits only until Sync() is done -->
    <rect x="140" y="264" width="118" height="28" rx="4" fill="#0284c7"/><text x="199" y="283">Prepare F0</text>
    <rect x="260" y="264" width="28" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-dasharray="4,3"/>
    <rect x="290" y="264" width="118" height="28" rx="4" fill="#0284c7"/><text x="349" y="283">Prepare F1</text>
    <rect x="410" y="264" width="58" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-dasharray="4,3"/>
    <rect x="470" y="264" width="118" height="28" rx="4" fill="#0284c7"/><text x="529" y="283">Prepare F2</text>
    <rect x="590" y="264" width="58" height="28" rx="4" fill="#1e293b" stroke="#475569" stroke-dasharray="4,3"/>
    <rect x="650" y="264" width="118" height="28" rx="4" fill="#0284c7"/><text x="709" y="283">Prepare F3</text>

    <rect x="260" y="300" width="28" height="28" rx="4" fill="#f59e0b"/><text x="274" y="319" fill="#0f172a">S</text>
    <rect x="290" y="300" width="148" height="28" rx="4" fill="#7e22ce"/><text x="364" y="319">Draw F0</text>
    <rect x="440" y="300" width="28" height="28" rx="4" fill="#f59e0b"/><text x="454" y="319" fill="#0f172a">S</text>
    <rect x="470" y="300" width="148" height="28" rx="4" fill="#7e22ce"/><text x="544" y="319">Draw F1</text>
    <rect x="620" y="300" width="28" height="28" rx="4" fill="#f59e0b"/><text x="634" y="319" fill="#0f172a">S</text>
    <rect x="650" y="300" width="148" height="28" rx="4" fill="#7e22ce"/><text x="724" y="319">Draw F2</text>
  </g>

  <!-- Legend -->
  <g font-size="11" fill="#94a3b8">
    <rect x="140" y="356" width="14" height="14" rx="3" fill="#f59e0b"/>
    <text x="162" y="367">S = Sync(): swap dirty staging state to the render side</text>
    <rect x="500" y="356" width="14" height="14" rx="3" fill="#1e293b" stroke="#475569" stroke-dasharray="3,2"/>
    <text x="522" y="367">main blocked on frameCV_</text>
  </g>
  <text x="140" y="389" font-size="11" fill="#64748b">ASYNC: main waits only until its frame is synced. It waits longer only if the render thread is still drawing the last one.</text>
</svg>
