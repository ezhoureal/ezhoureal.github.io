<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="850" height="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Scale: x = 150 + 60px per ms. 8.33ms deadline at x = 650. -->
  <rect width="850" height="380" rx="10" fill="#0f172a"/>

  <!-- Time grid -->
  <g stroke="#1e293b" stroke-width="1">
    <line x1="150" y1="60" x2="150" y2="335"/>
    <line x1="270" y1="60" x2="270" y2="335"/>
    <line x1="390" y1="60" x2="390" y2="335"/>
    <line x1="510" y1="60" x2="510" y2="335"/>
    <line x1="630" y1="60" x2="630" y2="335"/>
    <line x1="750" y1="60" x2="750" y2="335"/>
  </g>
  <g fill="#64748b" font-size="11" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">
    <text x="150" y="354">0ms</text>
    <text x="270" y="354">2ms</text>
    <text x="390" y="354">4ms</text>
    <text x="510" y="354">6ms</text>
    <text x="630" y="354">8ms</text>
    <text x="750" y="354">10ms</text>
  </g>

  <!-- 8.33ms deadline -->
  <line x1="650" y1="60" x2="650" y2="335" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 1. Serial -->
  <text x="24" y="44" fill="#f8fafc" font-size="14" font-weight="700">Serial: T_frame = T_prepare + T_draw + T_compose</text>
  <text x="24" y="99" fill="#94a3b8" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">one thread</text>
  <rect x="150" y="76" width="120" height="36" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="210" y="99" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Prepare 2ms</text>
  <rect x="270" y="76" width="300" height="36" rx="4" fill="#b91c1c" stroke="#f87171" stroke-width="1.5"/>
  <text x="420" y="99" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Draw spike 5ms</text>
  <rect x="570" y="76" width="120" height="36" rx="4" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
  <text x="630" y="99" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Compose 2ms</text>
  <rect x="702" y="78" width="132" height="32" rx="6" fill="#450a0a" stroke="#ef4444"/>
  <text x="768" y="99" fill="#fca5a5" font-size="12" font-weight="700" text-anchor="middle">9ms: frame dropped</text>
  <path d="M150 122 v6 h540 v-6" stroke="#64748b" fill="none"/>
  <text x="420" y="144" fill="#94a3b8" font-size="11" text-anchor="middle">every spike adds to the same total</text>

  <line x1="20" y1="166" x2="830" y2="166" stroke="#334155"/>

  <!-- 2. Pipelined -->
  <text x="24" y="194" fill="#f8fafc" font-size="14" font-weight="700">Pipelined: throughput ≈ max(T_prepare, T_draw, T_compose)</text>
  <text x="24" y="229" fill="#38bdf8" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">main</text>
  <rect x="150" y="210" width="120" height="30" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="210" y="230" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Prepare F2</text>

  <text x="24" y="269" fill="#c084fc" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">render</text>
  <rect x="150" y="250" width="300" height="30" rx="4" fill="#b91c1c" stroke="#f87171" stroke-width="1.5"/>
  <text x="300" y="270" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Draw spike F1 5ms</text>

  <text x="24" y="309" fill="#34d399" font-size="12" font-family="SFMono-Regular, Menlo, Consolas, monospace">composer</text>
  <rect x="150" y="290" width="120" height="30" rx="4" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
  <text x="210" y="310" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Compose F0</text>

  <rect x="470" y="250" width="160" height="30" rx="6" fill="#064e3b" stroke="#10b981"/>
  <text x="550" y="270" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">slowest stage 5ms: OK</text>

  <rect x="580" y="14" width="140" height="22" rx="4" fill="#ef4444"/>
  <text x="650" y="29" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">120Hz budget 8.3ms</text>
</svg>
