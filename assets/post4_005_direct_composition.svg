<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="850" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="d-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker>
    <marker id="d-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#10b981"/></marker>
  </defs>
  <rect width="850" height="320" rx="10" fill="#0f172a"/>

  <!-- Start -->
  <rect x="20" y="126" width="140" height="56" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="90" y="150" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">RSMainThread</text>
  <text x="90" y="167" fill="#e0f2fe" font-size="10" text-anchor="middle">prepare frame</text>
  <line x1="160" y1="154" x2="186" y2="154" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d-gray)"/>

  <!-- Decision -->
  <path d="M250 112 L314 154 L250 196 L186 154 Z" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="250" y="151" fill="#fef3c7" font-size="10" font-weight="700" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">doDirect</text>
  <text x="250" y="164" fill="#fef3c7" font-size="10" font-weight="700" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">Composition_?</text>

  <!-- NO: full pipeline (top) -->
  <path d="M250 112 L250 62 L336 62" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#d-gray)"/>
  <text x="258" y="90" fill="#94a3b8" font-size="11" font-weight="600">no</text>
  <rect x="340" y="36" width="150" height="52" rx="6" fill="#7e22ce" stroke="#c084fc" stroke-width="1.5"/>
  <text x="415" y="58" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">render thread</text>
  <text x="415" y="75" fill="#f3e8ff" font-size="10" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">Sync → OnDraw → Flush</text>
  <line x1="490" y1="62" x2="516" y2="62" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#d-gray)"/>
  <rect x="520" y="36" width="130" height="52" rx="6" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="585" y="58" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">GPU</text>
  <text x="585" y="75" fill="#fef3c7" font-size="10" text-anchor="middle">rasterize frame</text>
  <path d="M650 62 L760 62 L760 122" stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#d-gray)"/>

  <!-- Composer -->
  <rect x="690" y="126" width="140" height="56" rx="6" fill="#047857" stroke="#34d399" stroke-width="1.5"/>
  <text x="760" y="150" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">composer</text>
  <text x="760" y="167" fill="#d1fae5" font-size="10" text-anchor="middle" font-family="SFMono-Regular, Menlo, Consolas, monospace">SetRSLayers → Repaint</text>

  <!-- YES: DirectComposition (bottom) -->
  <path d="M250 196 L250 236 L336 236" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#d-green)"/>
  <text x="258" y="222" fill="#6ee7b7" font-size="11" font-weight="700">yes</text>
  <rect x="340" y="206" width="310" height="60" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="495" y="229" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">DirectComposition: layers straight to HWC</text>
  <text x="495" y="248" fill="#a7f3d0" font-size="10" text-anchor="middle">render thread stays asleep · GPU untouched</text>
  <path d="M650 236 L760 236 L760 186" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#d-green)"/>

  <text x="24" y="298" fill="#94a3b8" font-size="11">Taken only when nothing but HWC buffers changed: e.g. fullscreen video, no animation, no capture, single display.</text>
</svg>
